<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>俄羅斯方塊學習 - 難度分級打字版</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; touch-action: manipulation; -webkit-touch-callout: none; }
    body {
      margin: 0; padding: 10px; font-family: sans-serif;
      background: #1a1a1a; color: #fff; text-align: center;
      display: flex; flex-direction: column; align-items: center;
    }
    #score-board { font-size: 1.1rem; margin-bottom: 8px; color: #ffeb3b; }
    .top-bar-btn {
      display: none; color: white; border: none; padding: 6px 14px;
      border-radius: 20px; font-size: 0.85rem; margin: 4px; cursor: pointer; font-weight: bold;
    }
    #game-container { 
      position: relative; border: 3px solid #555; background: #000;
      width: 240px; height: 400px; overflow: hidden;
    }
    canvas { display: block; }
    #float-score {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      font-size: 1.8rem; font-weight: bold; color: #ffeb3b;
      text-shadow: 0 0 10px #ff5722, 0 0 20px #ff9800;
      pointer-events: none; opacity: 0; transition: all 0.8s ease-out; z-index: 50; width: 100%;
    }
    #float-score.show { transform: translate(-50%, -120%); opacity: 1; }

    #mobile-controls {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 8px; width: 100%; max-width: 320px; margin-top: 10px;
    }
    .ctrl-btn {
      background: #333; color: white; border: 2px solid #666;
      border-radius: 8px; padding: 12px 0; font-size: 1.2rem; user-select: none;
    }
    .ctrl-btn:active { background: #555; }
    .drop-btn { grid-column: span 4; background: #d32f2f; font-weight: bold; }

    .modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); display: flex;
      justify-content: center; align-items: center; z-index: 100;
    }
    .modal-box {
      background: #2a2a2a; padding: 20px; border-radius: 12px;
      width: 95%; max-width: 520px; text-align: left; max-height: 90vh; overflow-y: auto;
    }
    .option-btn {
      width: 100%; margin: 8px 0; padding: 12px; font-size: 1rem;
      border-radius: 6px; border: none; background: #0288d1; color: white;
      text-align: left; cursor: pointer;
    }
    .option-btn:active { background: #01579b; }
    .input-field {
      width: 100%; padding: 10px; margin: 6px 0 14px; border-radius: 6px;
      border: 1px solid #777; background: #333; color: white; font-size: 1rem;
    }
    .q-img { max-width: 100%; max-height: 160px; border-radius: 6px; margin: 8px 0; display: block; }

    /* 難度標籤 Badge */
    .diff-badge {
      display: inline-block; padding: 4px 10px; border-radius: 12px;
      font-size: 0.8rem; font-weight: bold; margin-bottom: 8px;
    }
    .diff-1 { background: #2e7d32; color: #fff; } /* 簡單 */
    .diff-2 { background: #0288d1; color: #fff; } /* 普通 */
    .diff-3 { background: #ef6c00; color: #fff; } /* 難 */
    .diff-4 { background: #7b1fa2; color: #fff; } /* 非常難 */
    .diff-5 { background: #c2185b; color: #fff; } /* 地獄 */

    /* 後台頁籤 */
    .tab-bar { display: flex; border-bottom: 2px solid #444; margin-bottom: 15px; }
    .tab-btn {
      padding: 10px; background: transparent; color: #aaa;
      border: none; cursor: pointer; font-size: 0.95rem; font-weight: bold;
    }
    .tab-btn.active { color: #ffeb3b; border-bottom: 3px solid #ffeb3b; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.85rem; }
    th, td { border: 1px solid #444; padding: 8px; text-align: center; vertical-align: top; }
    th { background: #333; color: #ffeb3b; }
  </style>
</head>
<body>

  <!-- 1. Google 帳號登入視窗 -->
  <div id="login-modal" class="modal">
    <div class="modal-box" style="text-align:center;">
      <h3>🎮 答題俄羅斯方塊</h3>
      <p style="font-size:0.9rem; color:#aaa; margin-bottom:20px;">請使用 Google 帳號登入驗證身分：</p>
      
      <div id="g_id_onload" data-auto_prompt="false" data-callback="handleGoogleLogin"></div>
      <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with"></div>
      <div id="login-status" style="margin-top:15px; color:#81d4fa; font-size:0.9rem;"></div>
    </div>
  </div>

  <!-- 2. 學生自訂姓名確認視窗 -->
  <div id="name-modal" class="modal" style="display:none;">
    <div class="modal-box" style="text-align:center;">
      <h3 style="color:#4caf50;">✅ Google 帳號驗證成功！</h3>
      <p style="font-size:0.9rem; color:#aaa; text-align:left;">請確認或修改為您的<strong>班級、座號與真實姓名</strong>：</p>
      <input type="text" id="custom-name-input" class="input-field" placeholder="例如：302 05號 林小美">
      <button class="option-btn" style="text-align:center; background:#4caf50; font-weight:bold;" onclick="confirmStudentName()">進入挑戰 ➡️</button>
    </div>
  </div>

  <!-- 3. 答題視窗（支援難度分級 + 打字/選擇雙題型） -->
  <div id="quiz-modal" class="modal" style="display:none;">
    <div class="modal-box">
      <div id="q-diff-badge" class="diff-badge">難度載入中</div>
      <h3 id="q-title" style="margin-top:0;">題目載入中...</h3>
      <img id="q-image" class="q-img" style="display:none;" />
      
      <!-- 選擇題容器 -->
      <div id="options-container"></div>

      <!-- 打字填空題容器 -->
      <div id="typing-container" style="display:none;">
        <input type="text" id="type-answer-input" class="input-field" placeholder="請在此打字輸入答案..." autocomplete="off">
        <button id="type-submit-btn" class="option-btn" style="text-align:center; background:#ff9800; font-weight:bold;" onclick="checkTypeAnswer()">送出答案 🚀</button>
      </div>

      <div id="feedback" style="margin-top:10px; font-weight:bold; line-height:1.4;"></div>
      <button id="after-answer-btn" class="option-btn" style="display:none; text-align:center; background:#4caf50;" onclick="handleAfterAnswer()">繼續 ➡️</button>
    </div>
  </div>

  <!-- 4. 回合結算選單（大幅上移避開手機按鈕） -->
  <div id="turn-modal" class="modal" style="display:none; align-items: flex-start; padding-top: 50px;">
    <div class="modal-box" style="text-align:center;">
      <h3 style="color:#ffeb3b;">🎯 方塊已就位！</h3>
      <p>目前累積總分：<b id="turn-score" style="font-size:1.4rem; color:#4caf50;">0</b> 分</p>
      <button class="option-btn" style="text-align:center; background:#4caf50;" onclick="continueToNextQuiz()">繼續挑戰下一題 ➡️</button>
      <button id="turn-save-btn" class="option-btn" style="text-align:center; background:#ff9800;" onclick="saveAndExit()">💾 儲存並退出</button>
    </div>
  </div>

  <!-- 5. 教師管理後台 -->
  <div id="admin-modal" class="modal" style="display:none;">
    <div class="modal-box">
      <div class="tab-bar" style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <button class="tab-btn active" onclick="switchAdminTab('scores')">📊 全班戰況即時榜</button>
          <button class="tab-btn" onclick="switchAdminTab('addQ')">➕ 新增題目</button>
        </div>
        <button style="background:#d32f2f; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:0.8rem; cursor:pointer;" onclick="logoutTeacher()">🚪 登出老師</button>
      </div>

      <!-- 頁籤一：全班戰況即時榜 -->
      <div id="tab-scores">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span style="font-size:0.85rem; color:#aaa;">全班作答即時排行榜：</span>
          <button style="padding:4px 8px; font-size:0.8rem; background:#0288d1; color:white; border:none; border-radius:4px; cursor:pointer;" onclick="fetchClassScores()">🔄 刷新榜單</button>
        </div>
        <div style="overflow-x:auto;">
          <table>
            <thead>
              <tr>
                <th style="width:20%;">姓名</th>
                <th style="width:12%;">總分</th>
                <th style="width:12%;">答對</th>
                <th style="width:40%;">錯題紀錄</th>
                <th style="width:16%;">時間</th>
              </tr>
            </thead>
            <tbody id="scores-tbody">
              <tr><td colspan="5">讀取戰況中...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 頁籤二：新增題目（支援難易度與題型選擇） -->
      <div id="tab-addQ" style="display:none;">
        <label>題目難易度（答對得分）：</label>
        <select id="adm-diff" class="input-field">
          <option value="1">🌱 簡單（答對 +1分）</option>
          <option value="2" selected>📘 普通（答對 +2分）</option>
          <option value="3">⚡ 難（答對 +3分）</option>
          <option value="4">🔥 非常難（答對 +4分）</option>
          <option value="5">☠️ 地獄（答對 +5分）</option>
        </select>

        <label>題型種類：</label>
        <select id="adm-type" class="input-field" onchange="toggleAdminQuestionType()">
          <option value="choice">四選一選擇題</option>
          <option value="text">學生打字填空題</option>
        </select>

        <label>題目內容：</label>
        <input type="text" id="adm-q" class="input-field" placeholder="例如：請輸入台灣最高峰名稱？">
        
        <label>圖片網址（可選，沒有請留空）：</label>
        <input type="text" id="adm-img" class="input-field" placeholder="https://.../photo.png">
        
        <!-- 選擇題專屬區域 -->
        <div id="adm-choice-box">
          <label>選項 1 ~ 4：</label>
          <input type="text" id="adm-opt1" class="input-field" placeholder="選項 1">
          <input type="text" id="adm-opt2" class="input-field" placeholder="選項 2">
          <input type="text" id="adm-opt3" class="input-field" placeholder="選項 3">
          <input type="text" id="adm-opt4" class="input-field" placeholder="選項 4">

          <label>正確選項：</label>
          <select id="adm-ans-choice" class="input-field">
            <option value="1">選項 1</option>
            <option value="2">選項 2</option>
            <option value="3">選項 3</option>
            <option value="4">選項 4</option>
          </select>
        </div>

        <!-- 打字題專屬區域 -->
        <div id="adm-text-box" style="display:none;">
          <label>正確答案（多個正解可用逗號分隔）：</label>
          <input type="text" id="adm-ans-text" class="input-field" placeholder="例如：玉山, Mt. Jade">
        </div>

        <label>答錯時是否公布解答？</label>
        <select id="adm-show" class="input-field">
          <option value="true">公布正解與解析</option>
          <option value="false">不公布（挑戰思考題）</option>
        </select>

        <label>解析說明：</label>
        <input type="text" id="adm-exp" class="input-field" placeholder="解析內容...">

        <button class="option-btn" style="text-align:center; background:#e91e63;" onclick="submitNewQuestion()">➕ 寫入雲端題庫</button>
      </div>

      <div style="margin-top:15px; display:flex; gap:10px;">
        <button class="option-btn" style="text-align:center; background:#4caf50; flex:1;" onclick="startTeacherTest()">🎮 進入試玩測試</button>
        <button class="option-btn" style="text-align:center; background:#555; flex:1;" onclick="closeAdmin()">關閉後台</button>
      </div>
    </div>
  </div>

  <!-- 頂部資訊列 -->
  <div>
    <button id="admin-entry-btn" class="top-bar-btn" style="background:#e91e63;" onclick="openAdmin()">⚙️ 教師管理戰報</button>
  </div>
  <div id="score-board">
    選手: <span id="display-name">-</span> | 累計總分: <span id="score">0</span>
  </div>

  <div id="game-container">
    <canvas id="tetris" width="240" height="400"></canvas>
    <div id="float-score">+0</div>
  </div>

  <!-- 手機按鈕（轉向在向下旁邊 + 長按連發） -->
  <div id="mobile-controls">
    <button class="ctrl-btn" id="btn-left">⬅️</button>
    <button class="ctrl-btn" id="btn-right">➡️</button>
    <button class="ctrl-btn" id="btn-down">⬇️</button>
    <button class="ctrl-btn" id="btn-rotate">🔄</button>
    <button class="ctrl-btn drop-btn" onclick="playerHardDrop()">⚡ 到底放置</button>
  </div>

<script>
/* ==================== 1. 老師設定區 ==================== */
const GOOGLE_CLIENT_ID = "479239925260-p9kvntbmlp23ginho02tou72ckg0n9f1.apps.googleusercontent.com";
const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzWLVLbAAVd3rGVktP08gluiIqzSn4xSl-0QFRZF8wNcEqCN9d-MFeEX8YO3MIEFJOV/exec";
const TEACHER_EMAIL = "s256724@gmail.com"; // 替換為您的 Gmail！

document.getElementById("g_id_onload").setAttribute("data-client_id", GOOGLE_CLIENT_ID);

/* ==================== 2. 身分驗證與分流 ==================== */
let userEmail = "";
let userName = "";
let isTeacher = false;
let questions = [];
let currentQIndex = 0;
let totalScore = 0;
let correctCount = 0;
let answeredCorrectly = false;
let arena = createMatrix(12, 20);
let gamePaused = true;
let wrongQuestions = [];

const diffConfigs = {
  1: { name: "🌱 簡單 (+1分)", class: "diff-1", score: 1 },
  2: { name: "📘 普通 (+2分)", class: "diff-2", score: 2 },
  3: { name: "⚡ 難 (+3分)", class: "diff-3", score: 3 },
  4: { name: "🔥 非常難 (+4分)", class: "diff-4", score: 4 },
  5: { name: "☠️ 地獄 (+5分)", class: "diff-5", score: 5 }
};

function decodeJwt(token) {
  const base64Url = token.split('.')[1];
  const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
  return JSON.parse(decodeURIComponent(escape(window.atob(base64))));
}

async function handleGoogleLogin(response) {
  const payload = decodeJwt(response.credential);
  userEmail = payload.email.toLowerCase();
  userName = payload.name;
  isTeacher = (userEmail === TEACHER_EMAIL.toLowerCase());

  document.getElementById("login-status").innerText = "驗證成功，正在同步雲端資料...";
  await loadQuestionsFromCloud();

  if (isTeacher) {
    localStorage.setItem("remembered_teacher", JSON.stringify({ email: userEmail, name: userName }));
    document.getElementById("login-modal").style.display = "none";
    document.getElementById("admin-entry-btn").style.display = "inline-block";
    document.getElementById("display-name").innerText = `${userName} (教師)`;
    openAdmin();
  } else {
    localStorage.removeItem("remembered_teacher");
    document.getElementById("login-modal").style.display = "none";
    document.getElementById("custom-name-input").value = userName;
    document.getElementById("name-modal").style.display = "flex";
  }
}

function logoutTeacher() {
  if (confirm("確定要登出老師身分嗎？")) {
    localStorage.removeItem("remembered_teacher");
    location.reload();
  }
}

window.addEventListener("DOMContentLoaded", async () => {
  const saved = localStorage.getItem("remembered_teacher");
  if (saved) {
    try {
      const data = JSON.parse(saved);
      if (data.email && data.email.toLowerCase() === TEACHER_EMAIL.toLowerCase()) {
        userEmail = data.email;
        userName = data.name;
        isTeacher = true;
        document.getElementById("login-modal").style.display = "none";
        document.getElementById("admin-entry-btn").style.display = "inline-block";
        document.getElementById("display-name").innerText = `${userName} (教師)`;
        await loadQuestionsFromCloud();
        openAdmin();
      }
    } catch (e) {
      localStorage.removeItem("remembered_teacher");
    }
  }
});

async function confirmStudentName() {
  const inputName = document.getElementById("custom-name-input").value.trim();
  if (!inputName) { alert("請輸入您的班級座號與姓名！"); return; }
  userName = inputName;
  document.getElementById("name-modal").style.display = "none";

  try {
    const res = await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "login", email: userEmail, name: userName })
    });
    const data = await res.json();
    if (data.status === "success") {
      totalScore = data.score;
      correctCount = data.correctCount;
      if (data.wrongList && data.wrongList !== "無 (全對)") wrongQuestions = data.wrongList.split("; ");
      if (data.arena && data.arena.length > 0) arena = data.arena;
    }
    document.getElementById("display-name").innerText = userName;
    updateScoreUI();
    draw();
    openQuiz();
  } catch (e) {
    alert("連線失敗，請檢查網路！");
  }
}

async function loadQuestionsFromCloud() {
  const res = await fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({ action: "getQuestions" })
  });
  const data = await res.json();
  if (data.status === "success") questions = data.questions;
}

/* ==================== 3. 教師後台管理 ==================== */
function openAdmin() {
  document.getElementById("admin-modal").style.display = "flex";
  fetchClassScores();
}
function closeAdmin() { document.getElementById("admin-modal").style.display = "none"; }

function switchAdminTab(tab) {
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("tab-scores").style.display = "none";
  document.getElementById("tab-addQ").style.display = "none";

  if (tab === "scores") {
    event.target.classList.add("active");
    document.getElementById("tab-scores").style.display = "block";
    fetchClassScores();
  } else {
    event.target.classList.add("active");
    document.getElementById("tab-addQ").style.display = "block";
  }
}

function toggleAdminQuestionType() {
  const type = document.getElementById("adm-type").value;
  if (type === "choice") {
    document.getElementById("adm-choice-box").style.display = "block";
    document.getElementById("adm-text-box").style.display = "none";
  } else {
    document.getElementById("adm-choice-box").style.display = "none";
    document.getElementById("adm-text-box").style.display = "block";
  }
}

async function fetchClassScores() {
  const tbody = document.getElementById("scores-tbody");
  tbody.innerHTML = `<tr><td colspan="5">更新數據中...</td></tr>`;
  try {
    const res = await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "getAllScores" })
    });
    const data = await res.json();
    if (data.status === "success") {
      tbody.innerHTML = "";
      if (data.students.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5">目前尚無作答紀錄</td></tr>`;
        return;
      }
      data.students.sort((a,b) => b.score - a.score);

      data.students.forEach(st => {
        let wrongHtml = `<span style="color:#4caf50;">無 (全對)</span>`;
        if (st.wrongList && st.wrongList !== "無" && st.wrongList !== "無 (全對)") {
          const list = st.wrongList.split(";").map(item => item.trim()).filter(Boolean);
          wrongHtml = list.map(item => `<div>• ${item}</div>`).join("");
        }
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><b>${st.name}</b></td>
          <td style="color:#4caf50; font-weight:bold;">${st.score}</td>
          <td>${st.correctCount}</td>
          <td style="color:#ff5252; font-size:0.75rem; text-align:left; line-height:1.5;">${wrongHtml}</td>
          <td style="font-size:0.75rem; color:#aaa;">${st.time}</td>
        `;
        tbody.appendChild(tr);
      });
    }
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="5" style="color:red;">載入失敗，請確認網路！</td></tr>`;
  }
}

async function submitNewQuestion() {
  const diff = document.getElementById("adm-diff").value;
  const type = document.getElementById("adm-type").value;
  const q = document.getElementById("adm-q").value.trim();
  const img = document.getElementById("adm-img").value.trim();
  const show = document.getElementById("adm-show").value === "true";
  const exp = document.getElementById("adm-exp").value.trim();

  let ans = "";
  let options = ["", "", "", ""];

  if (type === "choice") {
    options = [
      document.getElementById("adm-opt1").value.trim(),
      document.getElementById("adm-opt2").value.trim(),
      document.getElementById("adm-opt3").value.trim(),
      document.getElementById("adm-opt4").value.trim()
    ];
    ans = document.getElementById("adm-ans-choice").value;
    if (!q || !options[0] || !options[1] || !options[2] || !options[3]) {
      alert("請完整填寫選擇題的題目與四個選項！"); return;
    }
  } else {
    ans = document.getElementById("adm-ans-text").value.trim();
    if (!q || !ans) {
      alert("請填寫填空題的題目與正確答案！"); return;
    }
  }

  await fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "addQuestion", q, img, options, ans,
      showAnswer: show, explanation: exp, difficulty: diff, type: type
    })
  });

  alert("🎉 新題目已新增至雲端！全班學生立刻同步！");
  await loadQuestionsFromCloud();
  switchAdminTab("scores");
}

function startTeacherTest() {
  closeAdmin();
  openQuiz();
}

/* ==================== 4. 答題邏輯（支援打字 + 選擇題） ==================== */
function autoSaveToCloud() {
  const wrongText = wrongQuestions.length > 0 ? wrongQuestions.join("; ") : "無 (全對)";
  fetch(GOOGLE_SCRIPT_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "saveScore", email: userEmail, name: userName,
      score: totalScore, correctCount: correctCount,
      wrongList: wrongText, arena: arena
    })
  });
}

function openQuiz() {
  document.getElementById("quiz-modal").style.display = "flex";
  loadQuestion();
}

function loadQuestion() {
  if (questions.length === 0) {
    alert("題庫為空，請老師至後台新增題目！"); return;
  }
  if (currentQIndex >= questions.length) currentQIndex = Math.floor(Math.random() * questions.length);
  const qData = questions[currentQIndex];

  // 1. 設置難易度標籤
  const diff = diffConfigs[qData.difficulty] || diffConfigs[2];
  const badge = document.getElementById("q-diff-badge");
  badge.innerText = diff.name;
  badge.className = `diff-badge ${diff.class}`;

  document.getElementById("q-title").innerText = `Q: ${qData.q}`;
  
  // 2. 圖片支援
  const imgEl = document.getElementById("q-image");
  if (qData.img) { imgEl.src = qData.img; imgEl.style.display = "block"; }
  else { imgEl.style.display = "none"; }

  document.getElementById("feedback").innerText = "";
  document.getElementById("after-answer-btn").style.display = "none";

  const optContainer = document.getElementById("options-container");
  const typeContainer = document.getElementById("typing-container");

  // 3. 題型分流：選擇題 vs 打字填空題
  if (qData.type === "text") {
    // 打字題
    optContainer.style.display = "none";
    typeContainer.style.display = "block";
    const input = document.getElementById("type-answer-input");
    input.value = "";
    input.disabled = false;
    document.getElementById("type-submit-btn").disabled = false;
    setTimeout(() => input.focus(), 300);
  } else {
    // 選擇題
    typeContainer.style.display = "none";
    optContainer.style.display = "block";
    optContainer.innerHTML = "";

    qData.options.forEach((opt, index) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.innerText = `${index + 1}. ${opt}`;
      btn.onclick = () => checkChoiceAnswer(index + 1);
      optContainer.appendChild(btn);
    });
  }
}

// 監聽打字題的 Enter 鍵送出
document.getElementById("type-answer-input").addEventListener("keypress", function(e) {
  if (e.key === "Enter") checkTypeAnswer();
});

// 選擇題核對
function checkChoiceAnswer(chosenNum) {
  const qData = questions[currentQIndex];
  document.querySelectorAll("#options-container .option-btn").forEach(b => b.disabled = true);
  const isRight = (String(chosenNum) === String(qData.ans));
  processAnswerResult(isRight, `選項 ${qData.ans}. ${qData.options[Number(qData.ans) - 1]}`);
}

// 打字題核對（支援逗號多重答案、忽略大小寫與前後空格）
function checkTypeAnswer() {
  const qData = questions[currentQIndex];
  const userText = document.getElementById("type-answer-input").value.trim().toLowerCase();
  if (!userText) { alert("請先輸入答案！"); return; }

  document.getElementById("type-answer-input").disabled = true;
  document.getElementById("type-submit-btn").disabled = true;

  // 正確答案可能以逗號分隔多個同義詞
  const acceptedAnswers = qData.ans.split(",").map(a => a.trim().toLowerCase()).filter(Boolean);
  const isRight = acceptedAnswers.includes(userText);
  processAnswerResult(isRight, qData.ans);
}

// 統一結算判定與加分
function processAnswerResult(isRight, correctAnswerText) {
  const qData = questions[currentQIndex];
  const feedback = document.getElementById("feedback");
  const nextBtn = document.getElementById("after-answer-btn");
  const diff = diffConfigs[qData.difficulty] || diffConfigs[2];

  if (isRight) {
    correctCount++;
    answeredCorrectly = true;
    totalScore += diff.score; // 依難度獲得基礎分 (1~5分)！
    updateScoreUI();
    showFloatingScore(diff.score, `難度加分`);

    feedback.style.color = "#4caf50";
    feedback.innerText = `🎉 答對了！獲得【+${diff.score}分】並取得隨機方塊！`;
    nextBtn.innerText = "開始放置方塊 ➡️";
  } else {
    answeredCorrectly = false;
    const qShort = qData.q.length > 6 ? qData.q.substring(0, 6) + "..." : qData.q;
    const wrongInfo = `第${qData.id || currentQIndex + 1}題(${qShort})`;
    if (!wrongQuestions.includes(wrongInfo)) wrongQuestions.push(wrongInfo);

    feedback.style.color = "#f44336";
    if (qData.showAnswer) {
      feedback.innerText = `❌ 答錯了！正確答案是：【${correctAnswerText}】。\n解析：${qData.explanation}`;
    } else {
      feedback.innerText = "❌ 答錯了！此題為思考題不公開答案，請再接再厲！";
    }
    nextBtn.innerText = "下一題 ➡️";
  }

  nextBtn.style.display = "block";
  autoSaveToCloud();
}

function handleAfterAnswer() {
  document.getElementById("quiz-modal").style.display = "none";
  if (answeredCorrectly) {
    playerReset();
    gamePaused = false;
  } else {
    currentQIndex++;
    openQuiz();
  }
}

function showTurnOptions() {
  document.getElementById("turn-score").innerText = totalScore;
  const turnModal = document.getElementById("turn-modal");
  const saveBtn = document.getElementById("turn-save-btn");

  // 防誤觸 0.5 秒延遲
  if (saveBtn) {
    saveBtn.disabled = true;
    saveBtn.style.opacity = "0.6";
    setTimeout(() => {
      saveBtn.disabled = false;
      saveBtn.style.opacity = "1";
    }, 500);
  }
  turnModal.style.display = "flex";
}

function continueToNextQuiz() {
  document.getElementById("turn-modal").style.display = "none";
  currentQIndex++;
  openQuiz();
}

function saveAndExit() {
  autoSaveToCloud();
  alert("進度已完整同步！");
  location.reload();
}

/* ==================== 5. 方塊核心引擎（無限累積機制） ==================== */
const canvas = document.getElementById("tetris");
const context = canvas.getContext("2d");
context.scale(20, 20);

const player = { pos: {x: 0, y: 0}, matrix: null };
let clearingRows = [];
let flashState = false;

function createMatrix(w, h) {
  const matrix = [];
  while (h--) matrix.push(new Array(w).fill(0));
  return matrix;
}

function createPiece(type) {
  if (type === 'I') return [[0,1,0,0],[0,1,0,0],[0,1,0,0],[0,1,0,0]];
  if (type === 'L') return [[0,2,0],[0,2,0],[0,2,2]];
  if (type === 'J') return [[0,3,0],[0,3,0],[3,3,0]];
  if (type === 'O') return [[4,4],[4,4]];
  if (type === 'Z') return [[5,5,0],[0,5,5],[0,0,0]];
  if (type === 'S') return [[0,6,6],[6,6,0],[0,0,0]];
  if (type === 'T') return [[0,7,0],[7,7,7],[0,0,0]];
}

const colors = [null, '#00f0f0', '#ffaa00', '#0000f0', '#f0f000', '#f00000', '#00f000', '#a000f0'];

function draw() {
  context.fillStyle = '#000';
  context.fillRect(0, 0, canvas.width, canvas.height);
  
  arena.forEach((row, y) => {
    const isClearing = clearingRows.includes(y);
    row.forEach((value, x) => {
      if (value !== 0) {
        context.fillStyle = (isClearing && flashState) ? "#ffffff" : colors[value];
        context.fillRect(x, y, 1, 1);
        context.lineWidth = 0.05;
        context.strokeStyle = "#fff";
        context.strokeRect(x, y, 1, 1);
      }
    });
  });

  if (!gamePaused && player.matrix) drawMatrix(player.matrix, player.pos);
}

function drawMatrix(matrix, offset) {
  matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) {
        context.fillStyle = colors[value];
        context.fillRect(x + offset.x, y + offset.y, 1, 1);
        context.lineWidth = 0.05;
        context.strokeStyle = "#fff";
        context.strokeRect(x + offset.x, y + offset.y, 1, 1);
      }
    });
  });
}

// 棋盤堆滿：清空盤面，分數永遠累加！
function playerReset() {
  const pieces = 'ILJOZST';
  player.matrix = createPiece(pieces[Math.floor(pieces.length * Math.random())]);
  player.pos.y = 0;
  player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

  if (collide(arena, player)) {
    alert(`💥 棋盤已堆滿！\n已為您清空棋盤，目前累積總分【${totalScore} 分】將繼續累加，請繼續挑戰！`);
    arena.forEach(row => row.fill(0));
    draw();
    autoSaveToCloud();
    gamePaused = true;
    currentQIndex++;
    openQuiz();
    return;
  }
}

function collide(arena, player) {
  const m = player.matrix;
  const o = player.pos;
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < m[y].length; ++x) {
      if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
    }
  }
  return false;
}

function merge(arena, player) {
  player.matrix.forEach((row, y) => {
    row.forEach((value, x) => {
      if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
    });
  });
}

function checkAndAnimateClear(callback) {
  clearingRows = [];
  for (let y = arena.length - 1; y >= 0; --y) {
    if (arena[y].every(v => v !== 0)) clearingRows.push(y);
  }

  const lines = clearingRows.length;
  if (lines === 0) { callback(); return; }

  let flashCount = 0;
  const flashInterval = setInterval(() => {
    flashState = !flashState;
    draw();
    flashCount++;
    if (flashCount >= 6) {
      clearInterval(flashInterval);
      clearingRows.sort((a,b) => a - b).forEach(y => {
        arena.splice(y, 1);
        arena.unshift(new Array(12).fill(0));
      });
      clearingRows = [];
      flashState = false;

      const multiplier = Math.min(lines, 4);
      const earned = lines * multiplier;
      totalScore += earned;
      updateScoreUI();
      showFloatingScore(earned, `${multiplier}倍加乘`);
      autoSaveToCloud();

      setTimeout(callback, 800);
    }
  }, 60);
}

function showFloatingScore(score, text) {
  const floatEl = document.getElementById("float-score");
  floatEl.innerText = `+${score} 分! (${text})`;
  floatEl.classList.add("show");
  setTimeout(() => floatEl.classList.remove("show"), 1000);
}

function updateScoreUI() {
  document.getElementById("score").innerText = totalScore;
}

function lockPiece() {
  gamePaused = true;
  merge(arena, player);
  draw();
  checkAndAnimateClear(() => {
    showTurnOptions();
  });
}

function playerMove(dir) {
  if (gamePaused) return;
  player.pos.x += dir;
  if (collide(arena, player)) player.pos.x -= dir;
  draw();
}

function playerDropSlow() {
  if (gamePaused) return;
  player.pos.y++;
  if (collide(arena, player)) {
    player.pos.y--;
    lockPiece();
  }
  draw();
}

function playerHardDrop() {
  if (gamePaused) return;
  while (!collide(arena, player)) player.pos.y++;
  player.pos.y--;
  lockPiece();
  draw();
}

function playerRotate() {
  if (gamePaused) return;
  const m = player.matrix;
  for (let y = 0; y < m.length; ++y) {
    for (let x = 0; x < y; ++x) [m[x][y], m[y][x]] = [m[y][x], m[x][y]];
  }
  m.forEach(row => row.reverse());
  let offset = 1;
  while (collide(arena, player)) {
    player.pos.x += offset;
    offset = -(offset + (offset > 0 ? 1 : -1));
    if (offset > m[0].length) { player.matrix.reverse(); return; }
  }
  draw();
}

document.addEventListener('keydown', e => {
  if (e.key === "ArrowLeft") playerMove(-1);
  else if (e.key === "ArrowRight") playerMove(1);
  else if (e.key === "ArrowDown") playerDropSlow();
  else if (e.key === "ArrowUp") playerRotate();
  else if (e.code === "Space") playerHardDrop();
});

/* ==================== 6. 手機長按連發控制器 ==================== */
function bindContinuousPress(buttonId, actionFn, initialDelay = 180, repeatInterval = 60) {
  const btn = document.getElementById(buttonId);
  if (!btn) return;
  let timeoutId = null;
  let intervalId = null;

  const start = (e) => {
    if (e.cancelable) e.preventDefault();
    actionFn();
    clearTimeout(timeoutId);
    clearInterval(intervalId);
    timeoutId = setTimeout(() => {
      intervalId = setInterval(actionFn, repeatInterval);
    }, initialDelay);
  };

  const stop = () => {
    clearTimeout(timeoutId);
    clearInterval(intervalId);
  };

  btn.addEventListener('touchstart', start, { passive: false });
  btn.addEventListener('touchend', stop);
  btn.addEventListener('touchcancel', stop);
  btn.addEventListener('mousedown', start);
  btn.addEventListener('mouseup', stop);
  btn.addEventListener('mouseleave', stop);
}

bindContinuousPress("btn-left", () => playerMove(-1), 180, 70);
bindContinuousPress("btn-right", () => playerMove(1), 180, 70);
bindContinuousPress("btn-down", () => playerDropSlow(), 150, 50);
bindContinuousPress("btn-rotate", () => playerRotate(), 220, 160);

setInterval(draw, 100);
</script>
